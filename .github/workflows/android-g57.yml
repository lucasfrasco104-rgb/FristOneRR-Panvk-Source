---
# Android (bionic) build of PanVK for Mali-G57 / JM kbase, for Winlator-style
# emulators. The other workflows in this repo build Linux (glibc) packages
# and cannot produce this file.
#
# EXPERIMENTAL / UNTESTED: written without access to an NDK, so the first
# run may need small fixes. Read the log of the first failing step.
name: PanVK Android G57 (NDK)

'on':
  push:
    branches: [master]
    paths:
      - '.github/workflows/android-g57.yml'
      - 'meson.build'
      - 'src/panfrost/**'
  workflow_dispatch:
    inputs:
      api_level:
        description: Android API level to target
        required: false
        default: '35'
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # Debian 13 has a SPIRV-Tools new enough for Mesa's mesa_clc (Ubuntu
    # 24.04's does not); the repo's own release workflow uses it too.
    container:
      image: debian:13
    timeout-minutes: 120
    env:
      API: ${{ inputs.api_level || '35' }}
      HOST_DIR: ${{ github.workspace }}/build-host
      HOST_PREFIX: ${{ github.workspace }}/host-prefix
      OUT_DIR: ${{ github.workspace }}/build-android
    steps:
      - name: Install base tools
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            ca-certificates curl git unzip zip

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build dependencies
        shell: bash
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            bison flex build-essential clang cmake ninja-build pkgconf \
            python3 python3-mako python3-packaging python3-pip \
            python3-setuptools python3-yaml glslang-tools spirv-tools \
            bindgen cargo rustc llvm-dev libclang-dev libclang-cpp-dev \
            libelf-dev libexpat1-dev zlib1g-dev libzstd-dev libdrm-dev
          LLVM_MAJOR="$(llvm-config --version | cut -d. -f1)"
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            "libclc-${LLVM_MAJOR}-dev" "libllvmspirvlib-${LLVM_MAJOR}-dev"
          python3 -m pip install --break-system-packages 'meson>=1.4.0,<2'

      # Tools that run on the build machine: mesa_clc, vtn_bindgen2 and the
      # precompiled-shader compiler.
      - name: Build host tools (mesa_clc and friends)
        shell: bash
        # Mesa's SPIRV-Tools check uses clang-only warning flags, so gcc
        # makes it fail even though SPIRV-Tools is new enough.
        env:
          CC: clang
          CXX: clang++
        run: |
          meson setup "${HOST_DIR}" \
            --prefix "${HOST_PREFIX}" \
            --buildtype release \
            -Dgallium-drivers= \
            -Dvulkan-drivers=panfrost \
            -Dpanfrost-kmds=kbase \
            -Dplatforms= \
            -Dglx=disabled -Degl=disabled -Dgbm=disabled \
            -Dllvm=enabled \
            -Dmesa-clc=enabled -Dinstall-mesa-clc=true \
            -Dprecomp-compiler=enabled -Dinstall-precomp-compiler=true \
            -Dbuild-tests=false
          meson install -C "${HOST_DIR}" --no-rebuild || \
            ninja -C "${HOST_DIR}" install
          ls -la "${HOST_PREFIX}/bin"

      - name: Download the Android NDK
        shell: bash
        run: |
          curl -fsSL -o ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q ndk.zip -d "${RUNNER_TEMP}"
          NDK="${RUNNER_TEMP}/android-ndk-r27c"
          test -d "${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "NDK=${NDK}" >> "${GITHUB_ENV}"
          echo "TOOLBIN=${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin" \
            >> "${GITHUB_ENV}"

      - name: Write the meson cross file
        shell: bash
        run: |
          cat > android-ndk-cross.txt <<EOF
          [binaries]
          c = ['${TOOLBIN}/aarch64-linux-android${API}-clang']
          cpp = ['${TOOLBIN}/aarch64-linux-android${API}-clang++', '-static-libstdc++']
          ar = '${TOOLBIN}/llvm-ar'
          strip = '${TOOLBIN}/llvm-strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'

          [built-in options]
          c_args = ['-O2']
          cpp_args = ['-O2']

          [properties]
          platform-sdk-version = ${API}
          # Never pick up the x86 libraries of the build machine.
          pkg_config_libdir = ['/nonexistent']
          EOF
          cat android-ndk-cross.txt

      - name: Configure Android build
        shell: bash
        env:
          CC: clang
          CXX: clang++
        run: |
          export PATH="${HOST_PREFIX}/bin:${PATH}"
          meson setup "${OUT_DIR}" \
            --cross-file android-ndk-cross.txt \
            --buildtype release \
            -Dplatforms=android \
            -Dplatform-sdk-version="${API}" \
            -Dandroid-stub=true \
            -Dgallium-drivers= \
            -Dvulkan-drivers=panfrost \
            -Dpanfrost-kmds=kbase \
            -Dvulkan-layers= \
            -Dglx=disabled -Degl=disabled -Dgbm=disabled \
            -Dllvm=disabled \
            -Dzstd=disabled \
            -Dmesa-clc=system -Dprecomp-compiler=system \
            -Dbuild-tests=false \
            -Dallow-fallback-for=libdrm \
            -Dlibdrm:default_library=static \
            -Dexpat:default_library=static \
            -Dzlib:default_library=static \
            --wrap-mode=default

      - name: Compile
        shell: bash
        run: |
          export PATH="${HOST_PREFIX}/bin:${PATH}"
          ninja -C "${OUT_DIR}" -j "$(nproc)"

      - name: Package driver
        shell: bash
        run: |
          SO="$(find "${OUT_DIR}" -name 'libvulkan_panfrost.so' | head -n1)"
          test -n "${SO}"
          # Unique, easy-to-recognise name for every build.
          DRV_NAME="PanVK-G57-RE4-b${GITHUB_RUN_NUMBER}"
          echo "DRV_NAME=${DRV_NAME}" >> "${GITHUB_ENV}"
          mkdir -p pkg
          cp "${SO}" pkg/libvulkan_panfrost.so
          "${TOOLBIN}/llvm-strip" --strip-unneeded pkg/libvulkan_panfrost.so
          SHA="$(sha256sum pkg/libvulkan_panfrost.so | cut -d' ' -f1)"
          cat > pkg/meta.json <<EOF
          {
            "author": "custom RE4 build",
            "description": "PanVK Mali-G57 build ${GITHUB_RUN_NUMBER} (RE4 profile opt-in: PANVK_PROFILE=re4)",
            "driverVersion": "Mesa 26.3.0-devel / G57-RE4 b${GITHUB_RUN_NUMBER}",
            "libraryName": "libvulkan_panfrost.so",
            "minApi": ${API},
            "name": "${DRV_NAME}",
            "packageVersion": "${DRV_NAME}",
            "sanitizedArtifactSha256": "${SHA}",
            "schemaVersion": 1,
            "vendor": "Mesa"
          }
          EOF
          readelf -d pkg/libvulkan_panfrost.so | grep -E 'NEEDED|SONAME' || true
          (cd pkg && zip -9 "../${DRV_NAME}.zip" libvulkan_panfrost.so meta.json)

      - name: Diagnostic report (compare with the stock driver)
        shell: bash
        run: |
          F=pkg/libvulkan_panfrost.so
          ls -l "${F}"
          echo "--- NEEDED"; readelf -d "${F}" | grep NEEDED || true
          echo "--- WSI symbols (stock driver: headless only)"
          for p in wsi_headless wsi_x11 wsi_wl xcb_ wsi_display; do
            printf '%s: ' "$p"; "${TOOLBIN}/llvm-nm" -D "${F}" 2>/dev/null | grep -c "$p" || true
          done
          echo "--- PANVK_ variables read by this build"
          strings -n 6 "${F}" | grep -E '^(PANVK_|PAN_)[A-Z0-9_]+$' | sort -u
          echo "--- Vulkan entry"
          "${TOOLBIN}/llvm-nm" -D "${F}" | grep -E 'vk_icdGetInstanceProcAddr|vk_icdNegotiate' || true

      - name: Upload driver package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DRV_NAME }}
          path: ${{ env.DRV_NAME }}.zip
