---
# Android (bionic) build of PanVK for Mali-G57 / JM kbase, for Winlator-style
# emulators (WinNative). The other workflows in this repo build Linux (glibc)
# packages and cannot produce this file.
#
# Goal: reproduce the published release driver (Panvk-Mali-G57-beta_1.2.0) as
# closely as possible. Several candidate configurations are built, every one
# is checked against invariants taken from the release binary (no asserts,
# same dynamic dependencies, same exported symbols, ELF TLS) and a compact
# fingerprint (function sizes, imports, ELF layout) is published next to each
# package so the candidates can be compared with the release binary.
name: PanVK Android G57 (NDK)

'on':
  push:
    branches: [master]
    paths:
      - '.github/workflows/android-g57.yml'
      - 'meson.build'
      - 'src/panfrost/**'
  workflow_dispatch:
    inputs:
      api_level:
        description: Android API level to target
        required: false
        default: '35'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    # Debian 13 has a SPIRV-Tools new enough for Mesa's mesa_clc (Ubuntu
    # 24.04's does not); the repo's own release workflow uses it too.
    container:
      image: debian:13
    timeout-minutes: 120
    env:
      API: ${{ inputs.api_level || '35' }}
      HOST_DIR: ${{ github.workspace }}/build-host
      HOST_PREFIX: ${{ github.workspace }}/host-prefix
    steps:
      - name: Install base tools
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            ca-certificates curl git unzip zip xz-utils

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build dependencies
        shell: bash
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            bison flex build-essential clang cmake ninja-build pkgconf \
            python3 python3-mako python3-packaging python3-pip \
            python3-setuptools python3-yaml glslang-tools spirv-tools \
            bindgen cargo rustc llvm-dev libclang-dev libclang-cpp-dev \
            libelf-dev libexpat1-dev zlib1g-dev libzstd-dev libdrm-dev
          LLVM_MAJOR="$(llvm-config --version | cut -d. -f1)"
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            "libclc-${LLVM_MAJOR}-dev" "libllvmspirvlib-${LLVM_MAJOR}-dev"
          python3 -m pip install --break-system-packages 'meson>=1.4.0,<2'

      # Tools that run on the build machine: mesa_clc, vtn_bindgen2 and the
      # precompiled-shader compiler.
      - name: Build host tools (mesa_clc and friends)
        shell: bash
        # Mesa's SPIRV-Tools check uses clang-only warning flags, so gcc
        # makes it fail even though SPIRV-Tools is new enough.
        env:
          CC: clang
          CXX: clang++
        run: |
          meson setup "${HOST_DIR}" \
            --prefix "${HOST_PREFIX}" \
            --buildtype release \
            -Dgallium-drivers= \
            -Dvulkan-drivers=panfrost \
            -Dpanfrost-kmds=kbase \
            -Dplatforms= \
            -Dglx=disabled -Degl=disabled -Dgbm=disabled \
            -Dllvm=enabled \
            -Dmesa-clc=enabled -Dinstall-mesa-clc=true \
            -Dprecomp-compiler=enabled -Dinstall-precomp-compiler=true \
            -Dbuild-tests=false
          meson install -C "${HOST_DIR}" --no-rebuild || \
            ninja -C "${HOST_DIR}" install
          ls -la "${HOST_PREFIX}/bin"

      - name: Download the Android NDK (the original driver used r29)
        shell: bash
        run: |
          for v in r29 r28c r27c; do
            if curl -fsSL -o ndk.zip \
                "https://dl.google.com/android/repository/android-ndk-${v}-linux.zip"; then
              echo "Using NDK ${v}"
              break
            fi
          done
          test -s ndk.zip
          unzip -q ndk.zip -d "${RUNNER_TEMP}"
          NDK="$(echo "${RUNNER_TEMP}"/android-ndk-*)"
          test -d "${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "NDK=${NDK}" >> "${GITHUB_ENV}"
          echo "TOOLBIN=${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin" \
            >> "${GITHUB_ENV}"

      # The release driver depends on libdrm.so, libz.so.1 and libzstd.so.1
      # (Termux builds, found in the emulator's own library folder at run
      # time). Those names do not exist inside the WinNative app process, so
      # the app's GPU probe cannot load the release driver and silently falls
      # back to the system Vulkan driver. A driver WITHOUT those dependencies
      # does load inside the app and has been crashing it. Adding the same
      # dependencies (empty stubs that exist only at link time) makes our
      # build behave exactly like the release one.
      - name: Create link-time stubs for the release driver dependencies
        shell: bash
        run: |
          set -euo pipefail
          STUBS="${GITHUB_WORKSPACE}/needed-stubs"
          mkdir -p "${STUBS}"
          for L in libdrm.so libz.so.1 libzstd.so.1; do
            SYM="frr_needed_stub_$(echo "${L}" | tr -c 'a-z0-9' '_')"
            printf 'void %s(void) {}\n' "${SYM}" > "${STUBS}/stub.c"
            "${TOOLBIN}/aarch64-linux-android${API}-clang" -shared -nostdlib \
              -fPIC -Wl,-soname,"${L}" -o "${STUBS}/${L}" "${STUBS}/stub.c"
          done
          rm -f "${STUBS}/stub.c"
          echo "STUBS=${STUBS}" >> "${GITHUB_ENV}"
          ls -l "${STUBS}"

      # Candidate configurations of the same source. The release driver has no
      # asserts (so it is a release / NDEBUG build) and imports
      # __stack_chk_fail (so it was built with a stack protector); everything
      # else about its compiler flags is unknown, so the candidates cover the
      # plausible combinations and are compared with the release binary
      # afterwards. Format: id|buildtype|extra c/c++ flags|target API|ndebug
      - name: Build driver candidates
        shell: bash
        env:
          CC: clang
          CXX: clang++
        run: |
          set -uo pipefail
          export PATH="${HOST_PREFIX}/bin:${PATH}"

          to_array() {
            local out="" f
            for f in $1; do out="${out:+${out}, }'${f}'"; done
            echo "${out}"
          }

          build_variant() {
            local V="$1" BT="$2" EXTRA="$3" TAPI="$4" NDB="$5"
            local OUT="${GITHUB_WORKSPACE}/build-android-${V}"
            local CARGS LINK
            CARGS="$(to_array "${EXTRA}")"
            LINK="'-L${STUBS}', '-Wl,--push-state,--no-as-needed', '-l:libdrm.so', '-l:libz.so.1', '-l:libzstd.so.1', '-Wl,--pop-state'"
            cat > "cross-${V}.txt" <<EOF
          [binaries]
          c = ['${TOOLBIN}/aarch64-linux-android${TAPI}-clang']
          cpp = ['${TOOLBIN}/aarch64-linux-android${TAPI}-clang++']
          ar = '${TOOLBIN}/llvm-ar'
          strip = '${TOOLBIN}/llvm-strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'

          [built-in options]
          c_args = [${CARGS}]
          cpp_args = [${CARGS}]
          c_link_args = [${LINK}]
          cpp_link_args = [${LINK}]

          [properties]
          platform-sdk-version = '${API}'
          pkg_config_libdir = ['/nonexistent']
          EOF
            local NDBARG=""
            if [ -n "${NDB}" ]; then NDBARG="-Db_ndebug=true"; fi
            meson setup "${OUT}" --cross-file "cross-${V}.txt" \
              --buildtype "${BT}" ${NDBARG} \
              -Dsplit-debug=disabled \
              -Dplatforms=android -Dandroid-stub=true -Dandroid-strict=true \
              -Dplatform-sdk-version="${API}" \
              -Dgallium-drivers= \
              -Dvulkan-drivers=panfrost -Dpanfrost-kmds=kbase \
              -Dshader-cache-default=true \
              -Dvulkan-manifest-per-architecture=true \
              -Dglx=disabled -Degl=disabled -Dgbm=disabled \
              -Dllvm=disabled \
              -Dzlib=enabled -Dexecmem=true -Dperfetto=false \
              -Dpanfrost-rust=false \
              -Dmesa-clc=system -Dprecomp-compiler=system \
              -Dinstall-mesa-clc=false -Dinstall-precomp-compiler=false \
              -Dbuild-tests=false \
              -Dallow-fallback-for=libdrm \
              -Dlibdrm:default_library=static \
              -Dexpat:default_library=static \
              -Dzlib:default_library=static \
              --wrap-mode=default \
            && ninja -C "${OUT}" -j "$(nproc)"
          }

          SPECS=(
            'a|release||35|'
            'b|release|-fstack-protector-strong|35|'
            'c|release|-O2 -fstack-protector-strong|35|'
            'd|debugoptimized|-fstack-protector-strong|35|true'
            'e|release|-fstack-protector-strong|24|'
          )
          : > built.txt
          for spec in "${SPECS[@]}"; do
            IFS='|' read -r ID BT EXTRA TAPI NDB <<< "${spec}"
            echo "::group::variant ${ID} (${BT} ${EXTRA} api${TAPI} ndebug=${NDB})"
            if build_variant "${ID}" "${BT}" "${EXTRA}" "${TAPI}" "${NDB}"; then
              echo "${ID}" >> built.txt
            else
              echo "::warning::variant ${ID} failed to build"
            fi
            echo "::endgroup::"
          done
          echo "Built variants: $(tr '\n' ' ' < built.txt)"
          test -s built.txt

      - name: Check invariants and package
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p publish
          NM="${TOOLBIN}/llvm-nm"
          RE="${TOOLBIN}/llvm-readelf"
          EXPECTED_EXPORTS=$'HMI\nvk_icdGetInstanceProcAddr\nvk_icdGetPhysicalDeviceProcAddr\nvk_icdNegotiateLoaderICDInterfaceVersion'
          : > passed.txt
          {
            echo "run b${GITHUB_RUN_NUMBER} commit ${GITHUB_SHA::7}"
            echo "variant | result | size | notes"
          } > "publish/b${GITHUB_RUN_NUMBER}-summary.txt"

          for V in $(cat built.txt); do
            NAME="Panvk-RE4-b${GITHUB_RUN_NUMBER}${V}"
            SO="$(find "${GITHUB_WORKSPACE}/build-android-${V}" -name 'libvulkan_panfrost.so' | head -n1)"
            test -n "${SO}"
            D="pkg-${V}"
            mkdir -p "${D}" "diag-${V}"

            # fingerprint of the unstripped file (for comparison with the release)
            "${NM}" -S --defined-only "${SO}" > "diag-${V}/defined.txt" || true
            "${NM}" -D --undefined-only "${SO}" > "diag-${V}/imports.txt" || true
            "${NM}" -D --defined-only "${SO}" > "diag-${V}/exports.txt" || true
            "${RE}" -W -h -l -S -d -n "${SO}" > "diag-${V}/elf.txt" || true
            "${RE}" -p .comment "${SO}" >> "diag-${V}/elf.txt" || true
            tar -cJf "publish/diag-${NAME}.tar.xz" "diag-${V}"

            # invariants taken from the release binary
            FAIL=""
            IMPORTS="$("${NM}" -D --undefined-only "${SO}")"
            DYN="$("${RE}" -d "${SO}")"
            if echo "${IMPORTS}" | grep -q '__assert2'; then
              FAIL="${FAIL} asserts-enabled"; fi
            if echo "${IMPORTS}" | grep -q '__emutls'; then
              FAIL="${FAIL} emulated-tls"; fi
            for L in libdrm.so libz.so.1 libzstd.so.1 liblog.so libnativewindow.so; do
              echo "${DYN}" | grep -q "\[${L}\]" || FAIL="${FAIL} missing-needed-${L}"
            done
            "${RE}" -l "${SO}" | grep -q ' TLS ' || FAIL="${FAIL} no-pt-tls"
            GOT="$("${NM}" -D --defined-only "${SO}" | awk '{print $3}' | sort)"
            [ "${GOT}" = "${EXPECTED_EXPORTS}" ] || FAIL="${FAIL} exports-differ"
            echo "${IMPORTS}" | grep -q '__stack_chk_fail' || \
              echo "note: no stack protector in ${V}" >> "${D}/notes.txt"

            SIZE="$(stat -c %s "${SO}")"
            if [ -n "${FAIL}" ]; then
              echo "variant ${V}: FAILED invariants:${FAIL}"
              echo "${V} | FAIL |${SIZE}| ${FAIL}" >> "publish/b${GITHUB_RUN_NUMBER}-summary.txt"
              continue
            fi

            cp "${SO}" "${D}/libvulkan_panfrost.so"
            # Like the release: keep the symbol table, drop only debug info.
            "${TOOLBIN}/llvm-strip" --strip-debug "${D}/libvulkan_panfrost.so"
            SHA="$(sha256sum "${D}/libvulkan_panfrost.so" | cut -d' ' -f1)"
            cat > "${D}/meta.json" <<EOF
          {
            "author": "custom RE4 build",
            "description": "PanVK for Mali-G57 (kbase), build ${GITHUB_RUN_NUMBER}${V}",
            "driverVersion": "Mesa 26.3.0-devel / Mali-G57-RE4-b${GITHUB_RUN_NUMBER}${V}",
            "libraryName": "libvulkan_panfrost.so",
            "minApi": ${API},
            "name": "${NAME}",
            "packageVersion": "${NAME}",
            "sanitizedArtifactSha256": "${SHA}",
            "schemaVersion": 1,
            "vendor": "Mesa"
          }
          EOF
            (cd "${D}" && zip -9 "../publish/${NAME}.zip" libvulkan_panfrost.so meta.json)
            {
              echo "== ${NAME}"; ls -l "${D}/libvulkan_panfrost.so"
              readelf -d "${D}/libvulkan_panfrost.so" | grep -E 'NEEDED|SONAME|RUNPATH|RPATH' || true
              readelf -l -W "${D}/libvulkan_panfrost.so" | grep -E 'TLS|LOAD' || true
              readelf -p .comment "${D}/libvulkan_panfrost.so" | head -6 || true
            } > "publish/${NAME}.info.txt" 2>&1
            echo "${V} | ok |${SIZE}| $(cat "${D}/notes.txt" 2>/dev/null | tr '\n' ' ')" \
              >> "publish/b${GITHUB_RUN_NUMBER}-summary.txt"
            echo "${V}" >> passed.txt
          done
          cat "publish/b${GITHUB_RUN_NUMBER}-summary.txt"
          ls -l publish
          test -s passed.txt

      - name: Publish build files to the 'builds' branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git clone -q --depth 1 --branch builds "${URL}" builds-repo 2>/dev/null; then
            git init -q -b builds builds-repo
            git -C builds-repo remote add origin "${URL}"
          fi
          mkdir -p "builds-repo/b${GITHUB_RUN_NUMBER}"
          cp publish/* "builds-repo/b${GITHUB_RUN_NUMBER}/"
          cd builds-repo
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "builds: b${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          git push -q origin builds
          echo "Published to branch 'builds', folder b${GITHUB_RUN_NUMBER}"

      - name: Upload driver packages
        uses: actions/upload-artifact@v4
        with:
          name: Panvk-RE4-b${{ github.run_number }}
          path: publish/*.zip
