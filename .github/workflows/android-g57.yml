---
# Android (bionic) build of PanVK for Mali-G57 / JM kbase, for Winlator-style
# emulators. The other workflows in this repo build Linux (glibc) packages
# and cannot produce this file.
#
# EXPERIMENTAL / UNTESTED: written without access to an NDK, so the first
# run may need small fixes. Read the log of the first failing step.
name: PanVK Android G57 (NDK)

'on':
  push:
    branches: [master]
    paths:
      - '.github/workflows/android-g57.yml'
      - 'meson.build'
      - 'src/panfrost/**'
  workflow_dispatch:
    inputs:
      api_level:
        description: Android API level to target
        required: false
        default: '35'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    # Debian 13 has a SPIRV-Tools new enough for Mesa's mesa_clc (Ubuntu
    # 24.04's does not); the repo's own release workflow uses it too.
    container:
      image: debian:13
    timeout-minutes: 120
    env:
      API: ${{ inputs.api_level || '35' }}
      HOST_DIR: ${{ github.workspace }}/build-host
      HOST_PREFIX: ${{ github.workspace }}/host-prefix
      OUT_DIR: ${{ github.workspace }}/build-android
    steps:
      - name: Install base tools
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            ca-certificates curl git unzip zip

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build dependencies
        shell: bash
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            bison flex build-essential clang cmake ninja-build pkgconf \
            python3 python3-mako python3-packaging python3-pip \
            python3-setuptools python3-yaml glslang-tools spirv-tools \
            bindgen cargo rustc llvm-dev libclang-dev libclang-cpp-dev \
            libelf-dev libexpat1-dev zlib1g-dev libzstd-dev libdrm-dev
          LLVM_MAJOR="$(llvm-config --version | cut -d. -f1)"
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            "libclc-${LLVM_MAJOR}-dev" "libllvmspirvlib-${LLVM_MAJOR}-dev"
          python3 -m pip install --break-system-packages 'meson>=1.4.0,<2'

      # Tools that run on the build machine: mesa_clc, vtn_bindgen2 and the
      # precompiled-shader compiler.
      - name: Build host tools (mesa_clc and friends)
        shell: bash
        # Mesa's SPIRV-Tools check uses clang-only warning flags, so gcc
        # makes it fail even though SPIRV-Tools is new enough.
        env:
          CC: clang
          CXX: clang++
        run: |
          meson setup "${HOST_DIR}" \
            --prefix "${HOST_PREFIX}" \
            --buildtype release \
            -Dgallium-drivers= \
            -Dvulkan-drivers=panfrost \
            -Dpanfrost-kmds=kbase \
            -Dplatforms= \
            -Dglx=disabled -Degl=disabled -Dgbm=disabled \
            -Dllvm=enabled \
            -Dmesa-clc=enabled -Dinstall-mesa-clc=true \
            -Dprecomp-compiler=enabled -Dinstall-precomp-compiler=true \
            -Dbuild-tests=false
          meson install -C "${HOST_DIR}" --no-rebuild || \
            ninja -C "${HOST_DIR}" install
          ls -la "${HOST_PREFIX}/bin"

      - name: Download the Android NDK (the original driver used r29)
        shell: bash
        run: |
          for v in r29 r28c r27c; do
            if curl -fsSL -o ndk.zip \
                "https://dl.google.com/android/repository/android-ndk-${v}-linux.zip"; then
              echo "Using NDK ${v}"
              break
            fi
          done
          test -s ndk.zip
          unzip -q ndk.zip -d "${RUNNER_TEMP}"
          NDK="$(echo "${RUNNER_TEMP}"/android-ndk-*)"
          test -d "${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "NDK=${NDK}" >> "${GITHUB_ENV}"
          echo "TOOLBIN=${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin" \
            >> "${GITHUB_ENV}"

      # Two variants of the same source, configured like the original release
      # (tools/fristonerr/build-options.txt):
      #   a: C++ runtime shared (libc++_shared.so), like the original driver
      #   b: C++ runtime linked statically (fallback if a does not load)
      - name: Build driver variants
        shell: bash
        env:
          CC: clang
          CXX: clang++
        run: |
          set -euo pipefail
          export PATH="${HOST_PREFIX}/bin:${PATH}"

          build_variant() {
            local V="$1" CPPLINK="$2"
            local OUT="${GITHUB_WORKSPACE}/build-android-${V}"
            cat > "cross-${V}.txt" <<EOF
          [binaries]
          c = ['${TOOLBIN}/aarch64-linux-android${API}-clang']
          cpp = ['${TOOLBIN}/aarch64-linux-android${API}-clang++'${CPPLINK}]
          ar = '${TOOLBIN}/llvm-ar'
          strip = '${TOOLBIN}/llvm-strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'

          [built-in options]

          [properties]
          platform-sdk-version = '${API}'
          pkg_config_libdir = ['/nonexistent']
          EOF
            meson setup "${OUT}" --cross-file "cross-${V}.txt" \
              -Dsplit-debug=disabled \
              -Dplatforms=android -Dandroid-stub=true -Dandroid-strict=true \
              -Dplatform-sdk-version="${API}" \
              -Dgallium-drivers= \
              -Dvulkan-drivers=panfrost -Dpanfrost-kmds=kbase \
              -Dshader-cache-default=true \
              -Dvulkan-manifest-per-architecture=true \
              -Dglx=disabled -Degl=disabled -Dgbm=disabled \
              -Dllvm=disabled \
              -Dzlib=enabled -Dexecmem=true -Dperfetto=false \
              -Dpanfrost-rust=false \
              -Dmesa-clc=system -Dprecomp-compiler=system \
              -Dinstall-mesa-clc=false -Dinstall-precomp-compiler=false \
              -Dbuild-tests=false \
              -Dallow-fallback-for=libdrm \
              -Dlibdrm:default_library=static \
              -Dexpat:default_library=static \
              -Dzlib:default_library=static \
              --wrap-mode=default
            ninja -C "${OUT}" -j "$(nproc)"
          }

          build_variant a ""
          build_variant b ", '-static-libstdc++'"

      - name: Package drivers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          for V in a b; do
            NAME="Panvk-RE4-b${GITHUB_RUN_NUMBER}${V}"
            SO="$(find "${GITHUB_WORKSPACE}/build-android-${V}" -name 'libvulkan_panfrost.so' | head -n1)"
            test -n "${SO}"
            D="pkg-${V}"
            mkdir -p "${D}"
            cp "${SO}" "${D}/libvulkan_panfrost.so"
            # Like the original: keep the symbol table, drop only debug info.
            "${TOOLBIN}/llvm-strip" --strip-debug "${D}/libvulkan_panfrost.so"
            SHA="$(sha256sum "${D}/libvulkan_panfrost.so" | cut -d' ' -f1)"
            cat > "${D}/meta.json" <<EOF
          {
            "author": "custom RE4 build",
            "description": "PanVK for Mali-G57 (kbase), build ${GITHUB_RUN_NUMBER}${V}",
            "driverVersion": "Mesa 26.3.0-devel / Mali-G57-RE4-b${GITHUB_RUN_NUMBER}${V}",
            "libraryName": "libvulkan_panfrost.so",
            "minApi": ${API},
            "name": "${NAME}",
            "packageVersion": "${NAME}",
            "sanitizedArtifactSha256": "${SHA}",
            "schemaVersion": 1,
            "vendor": "Mesa"
          }
          EOF
            (cd "${D}" && zip -9 "../publish/${NAME}.zip" libvulkan_panfrost.so meta.json)
            cp "${D}/libvulkan_panfrost.so" "publish/${NAME}.so"
            {
              echo "== ${NAME}"; ls -l "${D}/libvulkan_panfrost.so"
              readelf -d "${D}/libvulkan_panfrost.so" | grep -E 'NEEDED|SONAME|RUNPATH|RPATH' || true
              readelf -l -W "${D}/libvulkan_panfrost.so" | grep -E 'TLS|LOAD' || true
              readelf -p .comment "${D}/libvulkan_panfrost.so" | head -6 || true
            } | tee "publish/${NAME}.info.txt"
          done
          ls -l publish

      - name: Publish build files to the 'builds' branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git clone -q --depth 1 --branch builds "${URL}" builds-repo 2>/dev/null; then
            git init -q -b builds builds-repo
            git -C builds-repo remote add origin "${URL}"
          fi
          mkdir -p "builds-repo/b${GITHUB_RUN_NUMBER}"
          cp publish/* "builds-repo/b${GITHUB_RUN_NUMBER}/"
          cd builds-repo
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "builds: b${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          git push -q origin builds
          echo "Published to branch 'builds', folder b${GITHUB_RUN_NUMBER}"

      - name: Upload driver packages
        uses: actions/upload-artifact@v4
        with:
          name: Panvk-RE4-b${{ github.run_number }}
          path: publish/*.zip
